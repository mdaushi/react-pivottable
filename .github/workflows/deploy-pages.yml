name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build demo
        run: npx webpack -p

      - name: Move bundle to examples
        run: mv bundle.js examples/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
